<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2c1503">
  <title>Student portal temporarily unavailable | Arresalah Institute</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f7f3ec; color: #382718; font: 16px/1.6 Arial, sans-serif; }
    main { width: min(100%, 520px); padding: clamp(24px, 6vw, 42px); border: 1px solid #e4d4bc; border-radius: 16px; background: #fffdf9; box-shadow: 0 16px 48px rgba(44,21,3,.09); }
    p { margin: 0 0 12px; color: #68594c; }
    h1 { margin: 0 0 12px; color: #2c1503; font: 700 clamp(27px, 6vw, 36px)/1.2 Georgia, serif; }
    a { display: inline-block; margin-top: 10px; padding: 12px 18px; border-radius: 8px; background: #d4881e; color: #241405; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #f0b53f; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p>Arresalah Institute</p>
    <h1>Student portal temporarily unavailable</h1>
    <p>Student portal access is paused for now. Please contact the institute if you need assistance.</p>
    <a href="/">Return to the website</a>
  </main>
</body>
</html>
